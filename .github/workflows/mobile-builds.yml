name: Prepare unsigned mobile builds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run check
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug assembleRelease bundleRelease lint --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: PackLight-Android-unsigned
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/reports/lint-results*.html
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx cap sync ios
      - run: xcodebuild -version
      - name: Build for the simulator without signing
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath artifacts/ios-simulator CODE_SIGNING_ALLOWED=NO build
      - name: Prepare unsigned device archive
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath artifacts/PackLight-unsigned.xcarchive CODE_SIGNING_ALLOWED=NO archive
      - name: Package Xcode products
        run: |
          ditto -c -k --sequesterRsrc --keepParent artifacts/PackLight-unsigned.xcarchive artifacts/PackLight-unsigned.xcarchive.zip
          ditto -c -k --sequesterRsrc --keepParent artifacts/ios-simulator/Build/Products/Debug-iphonesimulator/App.app artifacts/PackLight-simulator.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PackLight-iOS-unsigned
          path: artifacts/*.zip
